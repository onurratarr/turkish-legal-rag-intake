[project]
name = "turkish-legal-rag-intake"
version = "0.1.0"
description = "Reference implementation: Turkish legal RAG + client intake with attorney review (synthetic data)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["legal_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
